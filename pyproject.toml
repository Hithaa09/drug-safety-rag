[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drug-safety-rag-b"
version = "0.1.0"
description = "Person B modules of Drug Safety RAG: label and paper ingest, RAG retriever, LLM layer, Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

# Heavy parts are optional so each can be installed on its own.
[project.optional-dependencies]
# Chunking only (light): text splitting with the embedding model's own tokenizer.
chunk = ["langchain-text-splitters>=0.3", "tokenizers>=0.20", "huggingface-hub>=0.24"]
rag = [
    "drug-safety-rag-b[chunk]",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]
llm = ["langchain-openai>=0.2", "httpx>=0.27"]
# The screen. The stand-in API (ui/stub_api.py) also uses the llm group.
ui = ["streamlit>=1.67,<2", "pandas>=2.0"]  # tested on 1.67 (the fixed banner relies on its layout)
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/drug_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# Third-party warning on Python 3.14 (langsmith), not ours.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
