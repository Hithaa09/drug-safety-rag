    section: "4.5 Interactions: combinations to be taken into account"
    section_key: drug_interactions
    french: |-
      Associations à prendre en compte
      […]
      + Antiagrégants plaquettaires
      Augmentation du risque hémorragique.
      […]
      + Inhibiteurs sélectifs de la recapture de la sérotonine (citalopram, escitalopram, fluoxétine, fluvoxamine, paroxétine, sertraline)
      Augmentation du risque hémorragique.
      […]
      + Médicaments mixtes adrénergiques-sérotoninergiques (amitriptyline, clomipramine, duloxétine, imipramine, milnacipran, oxitriptan, venlafaxine)
      Augmentation du risque hémorragique
      […]
      + Tramadol
      Augmentation du risque hémorragique
    english: |-
      Combinations to be taken into account
      […]
      + Antiplatelet agents
      Increased risk of bleeding.
      […]
      + Selective serotonin reuptake inhibitors (citalopram, escitalopram, fluoxetine, fluvoxamine, paroxetine, sertraline)
      Increased risk of bleeding.
      […]
      + Mixed adrenergic-serotonergic medicines (amitriptyline, clomipramine, duloxetine, imipramine, milnacipran, oxitriptan, venlafaxine)
      Increased risk of bleeding
      […]
      + Tramadol
      Increased risk of bleeding
