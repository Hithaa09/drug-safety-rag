  - id: pharmacokinetics-cyp2c9
    section: "5.2 Pharmacokinetic properties: biotransformation"
    section_key: clinical_pharmacology
    french: |-
      L’acénocoumarol est largement métabolisé. L’hydroxylation en 6- et 7- des deux énantiomères de l’acénocoumarol sont les métabolites principaux et le cytochrome P450 2C9 est le catalyseur majeur de la formation de ces 4 métabolites. Les autres enzymes impliquées dans le métabolisme du (R)-acénocoumarol sont le CYP1A2 et le CYP2C19. Par réduction du groupe keto, deux différents métabolites carbinol sont formés. La réduction du groupe nitro conduit à un amino-métabolite. La variabilité génétique liée au CYP2C9 participe à 14% de la variabilité interindividuelle de la réponse pharmacodynamique de l’acénocoumarol.
    english: |-
      Acenocoumarol is extensively metabolised. The 6- and 7-hydroxylated forms of the two enantiomers of acenocoumarol are the main metabolites, and cytochrome P450 2C9 is the main catalyst of the formation of these 4 metabolites. The other enzymes involved in the metabolism of (R)-acenocoumarol are CYP1A2 and CYP2C19. Reduction of the keto group forms two different carbinol metabolites. Reduction of the nitro group gives an amino metabolite. Genetic variability in CYP2C9 accounts for 14% of the inter-individual variability in the pharmacodynamic response to acenocoumarol.
