passages:
  - id: contraindications
    section: "4.3 Contraindications"
    section_key: contraindications
    french: |-
      4.3. Contre-indications
      Hypersensibilité à la substance active, l’acénocoumarol (ou aux dérivés coumariniques) ou à l’un des excipients mentionnés à la rubrique 6.1.
      Insuffisance hépatique sévère
      Hypertension sévère
      En cas d’association avec les médicaments ou composés suivants (voir rubrique 4.5) :
      1. l’acide acétylsalicylique :
      o Pour des doses anti-inflammatoires d’acide acétylsalicylique (≥ 1 g par prise et/ou ≥ 3 g par jour),
      o Pour des doses antalgiques ou antipyrétiques (≥ 500 mg par prise et/ou < 3 g par jour) et en cas d’antécédent d’ulcère gastro-duodénal,
      2. le miconazole utilisé par voie générale ou en gel buccal,
      3. le millepertuis.
      Grossesse, excepté chez les femmes enceintes portant une valve cardiaque mécanique, qui présentent un risque élevé de thromboembolie (voir rubriques 4.4 et 4.6).
    english: |-
      4.3 Contraindications
      Hypersensitivity to the active substance, acenocoumarol (or to coumarin derivatives), or to any of the excipients listed in section 6.1.
      Severe hepatic impairment
      Severe hypertension
      In combination with the following medicines or substances (see section 4.5):
      1. acetylsalicylic acid:
      o at anti-inflammatory doses of acetylsalicylic acid (≥ 1 g per dose and/or ≥ 3 g per day),
      o at analgesic or antipyretic doses (≥ 500 mg per dose and/or < 3 g per day) and in case of a history of gastroduodenal ulcer,
      2. miconazole used systemically or as an oral gel,
      3. St John's wort.
      Pregnancy, except in pregnant women with a mechanical heart valve, who are at high risk of thromboembolism (see sections 4.4 and 4.6).
    omitted: ""
