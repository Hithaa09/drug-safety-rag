  - id: leaflet-food-alcohol
    section: "Patient leaflet: food, drink and alcohol"
    section_key: patient_information
    french: |-
      La vitamine K peut diminuer l’effet de ce médicament. Certains aliments contiennent de la vitamine K en grande quantité. Les aliments les plus riches en vitamine K sont : les choux (chou frisé, chou de Bruxelles, chou blanc, brocolis...), les épinards et les asperges. Ces aliments ne sont pas interdits, à condition de les répartir dans votre alimentation de manière régulière et sans excès pour ne pas diminuer l’effet de ce médicament.
      L’alcool est à consommer avec modération puisque cela pourrait modifier le mode d’action de ce médicament.
    english: |-
      Vitamin K can reduce the effect of this medicine. Some foods contain large amounts of vitamin K. The foods richest in vitamin K are: cabbages (kale, Brussels sprouts, white cabbage, broccoli...), spinach and asparagus. These foods are not forbidden, provided they are spread regularly through your diet and eaten without excess, so as not to reduce the effect of this medicine.
      Alcohol should be consumed in moderation, as it could change the way this medicine works.
