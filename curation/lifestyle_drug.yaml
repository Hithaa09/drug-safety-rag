# DRAFT rules curated from FDA label text by Person B (2026-11-11). Not used for flags until
# each row is reviewed: set status: approved, reviewed_by and reviewed_on (see curation/README.md).
# Checked by `make verify-curation`.
rules:
- rule_id: lifestyle_drug:smoking:current:clozapine
  drug: clozapine
  rxcui: '2626'
  factor_type: smoking
  factor_values:
  - current
  effect: Lower clozapine levels and effect; a higher dose may be needed
  mechanism: Tobacco smoke induces CYP1A2
  severity: moderate
  severity_basis: may be necessary to increase
  evidence:
  - chunk_id: dailymed:90876802-0e3a-44c9-9ff7-1754dfbe736a:drug_interactions:002
    quote: Tobacco smoke is a moderate inducer of CYP1A2.
  - chunk_id: dailymed:90876802-0e3a-44c9-9ff7-1754dfbe736a:drug_interactions:002
    quote: It may be necessary to increase the CLOZARIL dose if used concomitantly with inducers of these
      enzymes.
  status: draft
  notes: Stopping smoking raises levels again; the label advises considering a dose reduction when inducers
    stop.
- rule_id: lifestyle_drug:smoking:current:theophylline
  drug: theophylline
  rxcui: '10438'
  factor_type: smoking
  factor_values:
  - current
  effect: Faster theophylline clearance (about 50-80%); dose needs and levels change
  mechanism: Tobacco smoking induces theophylline metabolism
  severity: moderate
  severity_basis: dose reduction
  evidence:
  - chunk_id: dailymed:882657ae-e15b-4c86-a571-b55460bd4726:clinical_pharmacology:021
    quote: Tobacco and marijuana smoking appears to increase the clearance of theophylline by induction
      of metabolic pathways.
  - chunk_id: dailymed:882657ae-e15b-4c86-a571-b55460bd4726:clinical_pharmacology:021
    quote: Careful attention to dose reduction and frequent monitoring of serum theophylline concentrations
      are required in patients who stop smoking
  status: draft
  notes: Recent quitters ('former') need dose reduction; the contract can't tell recent from long-ago
    quitting.
- rule_id: lifestyle_drug:alcohol:heavy:theophylline
  drug: theophylline
  rxcui: '10438'
  factor_type: alcohol
  factor_values:
  - heavy
  effect: Higher theophylline levels after a large dose of alcohol
  mechanism: Alcohol decreases theophylline clearance for up to 24 hours
  severity: minor
  severity_basis: decreases theophylline clearance
  evidence:
  - chunk_id: dailymed:882657ae-e15b-4c86-a571-b55460bd4726:precautions:008
    quote: A single large dose of alcohol (3 mL/kg of whiskey) decreases theophylline clearance for up
      to 24 hours
  status: draft
  review_flags:
  - Label describes a single large dose of alcohol (an acute binge), not chronic heavy drinking. Mapping
    to 'heavy' is a judgement call.
- rule_id: lifestyle_drug:diet_tag:grapefruit:simvastatin
  drug: simvastatin
  rxcui: '36567'
  factor_type: diet_tag
  factor_values:
  - grapefruit
  effect: Higher simvastatin levels; more myopathy and rhabdomyolysis
  mechanism: Grapefruit juice inhibits CYP3A4
  severity: major
  severity_basis: avoid
  evidence:
  - chunk_id: dailymed:8f55d5de-5a4f-4a39-8c84-c53976dd6af9:drug_interactions:006
    quote: Avoid grapefruit juice when taking ZOCOR.
  - chunk_id: dailymed:8f55d5de-5a4f-4a39-8c84-c53976dd6af9:drug_interactions:006
    quote: Grapefruit juice can raise the plasma levels of simvastatin and may increase the risk of myopathy
      and rhabdomyolysis.
  status: draft
- rule_id: lifestyle_drug:diet_tag:grapefruit:atorvastatin
  drug: atorvastatin
  rxcui: '83367'
  factor_type: diet_tag
  factor_values:
  - grapefruit
  effect: Higher atorvastatin levels with large quantities (more than 1.2 L daily)
  mechanism: Grapefruit juice inhibits CYP3A4
  severity: major
  severity_basis: avoid
  evidence:
  - chunk_id: dailymed:a60cc18b-0631-4cf0-b021-9f52224ece65:drug_interactions:007
    quote: Avoid intake of large quantities of grapefruit juice, more than 1.2 liters daily, when taking
      LIPITOR.
  status: draft
  notes: The label limits the warning to more than 1.2 L daily; a meal tag can't capture quantity.
  review_flags:
  - Label warns only above 1.2 L of grapefruit juice a day; a meal tag can't record quantity, so this
    would fire as major for any grapefruit. Consider a lower severity (severity_override_reason).
- rule_id: lifestyle_drug:diet_tag:high_vitamin_k:warfarin
  drug: warfarin
  rxcui: '11289'
  factor_type: diet_tag
  factor_values:
  - high_vitamin_k
  effect: Decreased INR response (less anticoagulation) with increased vitamin K intake
  mechanism: Vitamin K antagonises warfarin
  severity: moderate
  severity_basis: decreased inr response
  evidence:
  - chunk_id: dailymed:19a69a72-ac5d-45d5-a94d-a5aaecbe4730:warnings_and_precautions:005
    quote: 'decreasedINR response: increased vitamin K intake or hereditary warfarin resistance.'
  - chunk_id: dailymed:19a69a72-ac5d-45d5-a94d-a5aaecbe4730:dosage_and_administration:007
    quote: JANTOVEN has a narrow therapeutic range (index), and its action may be affected by factors
      such as other drugs and dietary vitamin K.
  status: draft
  notes: The first quote is the label text as parsed ('decreasedINR' has no space in the source).
