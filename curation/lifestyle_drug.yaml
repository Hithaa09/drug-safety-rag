      risk of metformin-associated lactic acidosis.
  - chunk_id: dailymed:fb832474-88d9-4e29-95cd-fbc446944cc4:warnings_and_precautions:003
    quote: Warn patients against excessive alcohol intake while receiving GLUMETZA.
