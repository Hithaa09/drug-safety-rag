# DRAFT rules curated from FDA label text by Person B (2026-11-11). Not used for flags until
# each row is reviewed: set status: approved, reviewed_by and reviewed_on (see curation/README.md).
# Checked by `make verify-curation`.
rules:
- rule_id: lab_drug:egfr:lt30:metformin
  drug: metformin
  rxcui: '6809'
  measure: egfr
  operator: <
  threshold: 30
  label_measure: eGFR
  label_threshold: '30'
  label_unit: mL/minute/1.73 m2
  action: Contraindicated below eGFR 30; discontinue if eGFR later falls below 30
  severity: contraindicated
  severity_basis: contraindicated
  evidence:
  - chunk_id: dailymed:fb832474-88d9-4e29-95cd-fbc446944cc4:dosage_and_administration:002
    quote: GLUMETZA is contraindicated in patients with an estimated glomerular filtration rate (eGFR)
      below 30 mL/minute/1.73 m2.
  - chunk_id: dailymed:fb832474-88d9-4e29-95cd-fbc446944cc4:dosage_and_administration:002
    quote: Discontinue GLUMETZA if the patient’s eGFR later falls below 30 mL/minute/1.73 m2
  status: draft
  notes: Spec worked example (eGFR about 28).
- rule_id: lab_drug:egfr:lt45:metformin
  drug: metformin
  rxcui: '6809'
  measure: egfr
  operator: <
  threshold: 45
  label_measure: eGFR
  label_threshold: '45'
  label_unit: mL/minute/1.73 m2
  action: Initiation not recommended at eGFR 30-45; if eGFR falls below 45, assess benefit and risk of
    continuing
  severity: moderate
  severity_basis: assess the benefit
  evidence:
  - chunk_id: dailymed:fb832474-88d9-4e29-95cd-fbc446944cc4:dosage_and_administration:002
    quote: In patients taking GLUMETZA whose eGFR later falls below 45 mL/minute/1.73 m2, assess the benefit
      risk of continuing therapy.
  - chunk_id: dailymed:fb832474-88d9-4e29-95cd-fbc446944cc4:warnings_and_precautions:002
    quote: Initiation of GLUMETZA is not recommended in patients with eGFR between 30 to 45 mL/minute/1.73
      m2.
  status: draft
  notes: Below 30 the contraindication rule also fires; the engine should report the most severe rule
    per drug and measure.
- rule_id: lab_drug:egfr:lt30:rosuvastatin
  drug: rosuvastatin
  rxcui: '301542'
  measure: egfr
  operator: <
  threshold: 30
  label_measure: CLcr
  label_threshold: '30'
  label_unit: mL/min/1.73 m2
  action: 'Severe renal impairment not on hemodialysis: start 5 mg once daily, do not exceed 10 mg once
    daily'
  severity: moderate
  severity_basis: recommended starting dosage
  evidence:
  - chunk_id: dailymed:325a5d0e-9a72-4015-9fcd-1655fb504cee:dosage_and_administration:005
    quote: In patients with severe renal impairment (CLcr less than 30 mL/min/1.73 m2) not on hemodialysis,
      the recommended starting dosage is 5 mg orally once daily and should not exceed 10 mg orally once
      daily
  status: draft
  proxy_note: Label states CLcr in mL/min/1.73 m2 (body-surface normalised); rule uses eGFR.
  review_flags:
  - Label measure is CLcr; rule uses eGFR (proxy). Pharmacist to confirm.
- rule_id: lab_drug:egfr:lt30:simvastatin
  drug: simvastatin
  rxcui: '36567'
  measure: egfr
  operator: <
  threshold: 30
  label_measure: CLcr
  label_threshold: '29'
  label_unit: mL/min
  action: 'Severe renal impairment (CLcr 15-29 mL/min): recommended starting dosage 5 mg once daily'
  severity: moderate
  severity_basis: recommended starting dosage
  evidence:
  - chunk_id: dailymed:8f55d5de-5a4f-4a39-8c84-c53976dd6af9:dosage_and_administration:004
    quote: For patients with severe renal impairment [creatinine clearance (CLcr) 15 – 29 mL/min], the
      recommended starting dosage of simvastatin is 5 mg once daily
  status: draft
  proxy_note: Label states CLcr 15-29 mL/min (Cockcroft-Gault); rule uses eGFR below 30 as the proxy.
  notes: Label range 15-29 is written as < 30 (the label's upper bound 29 is checked against the quote).
  review_flags:
  - Label measure is CLcr (Cockcroft-Gault); rule uses eGFR (proxy). Pharmacist to confirm.
- rule_id: lab_drug:egfr:lt30:tramadol
  drug: tramadol
  rxcui: '10689'
  measure: egfr
  operator: <
  threshold: 30
  label_measure: CLcr
  label_threshold: '30'
  label_unit: mL/min
  action: ConZip (extended-release) should not be used in severe renal impairment (CLcr < 30 mL/min)
  severity: major
  severity_basis: should not be used
  evidence:
  - chunk_id: dailymed:a65b4d05-3a1c-4aa1-848a-d20ac9aaf62f:clinical_pharmacology:018
    quote: The pharmacokinetics of tramadol has not been studied in patients with severe renal impairment
      (CLcr < 30 mL/min).
  - chunk_id: dailymed:a65b4d05-3a1c-4aa1-848a-d20ac9aaf62f:clinical_pharmacology:018
    quote: Therefore, CONZIP should not be used in patients with severe renal impairment.
  status: draft
  proxy_note: Label defines severe renal impairment as CLcr < 30 mL/min (Cockcroft-Gault); rule uses eGFR.
  notes: Specific to the extended-release product pinned (ConZip); an immediate-release tramadol label
    may differ.
  review_flags:
  - Label measure is CLcr (Cockcroft-Gault); rule uses eGFR (proxy). Pharmacist to confirm.
- rule_id: lab_drug:egfr:lt90:methotrexate
