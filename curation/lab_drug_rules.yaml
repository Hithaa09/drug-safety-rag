  rxcui: '6851'
  measure: egfr
  operator: <
  threshold: 90
  label_measure: CLcr
  label_threshold: '90'
  label_unit: mL/min
  action: 'Renal impairment (CLcr < 90 mL/min): closely monitor for adverse reactions; reduce dose or
    discontinue as appropriate'
  severity: minor
  severity_basis: closely monitor
  evidence:
  - chunk_id: dailymed:e942f8db-510f-44d6-acb5-b822196f5e8c:use_in_specific_populations:007
    quote: Closely monitor patients with renal impairment [creatinine clearance (CLcr) less than 90 mL/min,
