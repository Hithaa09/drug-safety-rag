- rule_id: lab_drug:anc:lt1_5:clozapine
  drug: clozapine
  rxcui: '2626'
  measure: anc
  operator: <
  threshold: 1.5
  label_measure: ANC
  label_threshold: '1500'
  label_unit: /μL
  action: Initiation not recommended if baseline ANC is below 1500/µL
  severity: major
  severity_basis: not recommended
  evidence:
  - chunk_id: dailymed:90876802-0e3a-44c9-9ff7-1754dfbe736a:warnings_and_precautions:002
    quote: CLOZARIL initiation is not recommended in patients with a baseline ANC less than 1500/μL.
  status: draft
  notes: Benign ethnic neutropenia (BEN) has a lower threshold (1000/µL); the patient contract can't record
    BEN yet.
  review_flags:
  - Applies to STARTING clozapine. For a patient already on it, ANC 1000-1499/µL is mild neutropenia,
    where the label says continue with monitoring three times weekly; a major flag would overstate that.
    The contract can't yet tell new from ongoing prescriptions (question for Person A).
