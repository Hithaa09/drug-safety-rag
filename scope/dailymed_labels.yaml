# One DailyMed label (set ID) per v1 drug. The DailyMed loader fetches exactly these.
#
# Chosen 2026-11-11 with `python -m drug_safety.ingest.dailymed suggest` plus manual checks:
#   prefer the brand (NDA) prescription label, oral tablet or capsule, single ingredient,
#   updated in the last 3 years; else the newest generic (ANDA); else the OTC label.
#
# kind:   brand | generic | otc | none
# review: ok      = reference brand, or the application holder's own label
#         check   = usable, but a better label may exist (repackager copy, unusual formulation)
#         missing = no US label; needs another source (decide with Person A)
# query:  name used to search DailyMed when it differs from the scope name
