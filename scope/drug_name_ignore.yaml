# Words the "no extra drug names" check (validator rule 4) must NOT treat as drug names.
#
# The check looks for every prescribable RxNorm ingredient (IN) and brand (BN) name
# (`make fetch-drug-names`). Some of those names are ordinary words, nutrients or lab analytes
# ("water", "iron", "glucose", "creatinine", "align", "react"), which would reject normal text.
#
# How this list was made (2026-11-11): every prescribable IN/BN name that is also an English
# dictionary word (macOS /usr/share/dict/words) was listed, then the names that are clearly
# medicines were taken back out by hand (`kept_as_drugs`, so morphine, heparin, lithium, Demerol
# are still caught). Vitamins are ignored because diet flags (e.g. vitamin K and warfarin) name
# them. Ethanol and nicotine are lifestyle factors, not prescriptions.
# 237 ingredient + 30 brand + 11 vitamin names ignored.
#
# To change: edit by hand, then `make fetch-drug-names verify-drug-names`.

kept_as_drugs:   # dictionary words that ARE medicines: still detected (for the record)
  ingredients: [amphetamine, apomorphine, aspirin, atropine, bacitracin, benzocaine, caffeine, chloramphenicol, chloroquine, cocaine, codeine, colchicine, cortisone, diethylstilbestrol, ephedrine, epinephrine, ergotamine, estradiol, estriol, gramicidin, heparin, hyaluronidase, hyoscyamine, lindane, lithium, methadone, methenamine, morphine, nitroglycerin, nitroprusside, opium, oxytocin, pancreatin, papaverine, pentobarbital, phenobarbital, physostigmine, pilocarpine, procaine, progesterone, pseudoephedrine, quinidine, quinine, salicylamide, scopolamine, streptomycin, sulfadiazine, sulfathiazole, testosterone, theophylline, yohimbine]
  brands: [adoxa, adrenalin, amidate, amytal, antara, demerol, dilantin, doxy, dramamine, emend, flector, forane, neffy, nembutal, soma, tenuate, trental]

