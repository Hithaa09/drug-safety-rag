  # Found 2026-11-11 by running the finder over all 8,549 evidence chunks and reading every
  # name it reported (444 distinct). These are body chemistry, clotting factors, hormones,
  # foods and lab chemicals as the evidence uses them, not something a patient is prescribed;
  # salicylic acid is aspirin's metabolite. Every other reported name was a real medicine.
