# Synthetic patients for the LLM evaluation (spec: "a manual check of about 10 reports").
# Together they use every one of the 26 gold flags (tests/gold/retrieval_flags.yaml, by case),
# so the LLM explains the same flags whose retrieval is already checked. Patient 1 is the spec's
# worked example (p18). Synthetic data only: these are the only patients sent to Colab.
patients:
  - id: p01-worked-example
    flags: [gene-clopidogrel-cyp2c19-pm, ddi-clopidogrel-omeprazole, lab-metformin-egfr]
    patient: {patient_id: p01, age: 68, sex: male,
              prescriptions: [{name: Plavix, dose: 75 mg}, {name: omeprazole, dose: 20 mg}, {name: metformin, dose: 500 mg}],
              labs: [{test: creatinine, value: 2.45, unit: mg/dL}], genotypes: [{gene: CYP2C19, diplotype: "*2/*2"}],
              lifestyle: {smoking: current, diet: {type: veg}}}
  - id: p02-warfarin
    flags: [gene-warfarin-cyp2c9-vkorc1, ddi-warfarin-ibuprofen, life-warfarin-vitamin-k]
    patient: {patient_id: p02, age: 74, sex: female,
              prescriptions: [{name: Coumadin, dose: 5 mg}, {name: ibuprofen, dose: 400 mg}],
              genotypes: [{gene: CYP2C9, diplotype: "*3/*3"}],
              lifestyle: {diet: {type: non_veg, meals: [spinach salad, kale soup]}}}
  - id: p03-codeine-paracetamol
    flags: [gene-codeine-cyp2d6-um, lab-paracetamol-liver, life-paracetamol-alcohol]
    patient: {patient_id: p03, age: 45, sex: male,
              prescriptions: [{name: codeine, dose: 30 mg}, {name: Tylenol, dose: 1000 mg}],
              labs: [{test: ALT, value: 150, unit: U/L}], genotypes: [{gene: CYP2D6, diplotype: "*1/*1xN"}],
              lifestyle: {alcohol: heavy}}
  - id: p04-simvastatin
    flags: [gene-simvastatin-slco1b1, ddi-simvastatin-amlodipine]
    patient: {patient_id: p04, age: 62, sex: male,
              prescriptions: [{name: simvastatin, dose: 40 mg}, {name: amlodipine, dose: 10 mg}],
              genotypes: [{gene: SLCO1B1, diplotype: "*5/*5"}]}
  - id: p05-methotrexate
    flags: [ddi-methotrexate-ppi, lab-methotrexate-renal, lab-methotrexate-cbc]
    patient: {patient_id: p05, age: 58, sex: female,
              prescriptions: [{name: methotrexate, dose: 15 mg, frequency: weekly}, {name: pantoprazole, dose: 40 mg}],
              labs: [{test: creatinine, value: 1.1, unit: mg/dL}, {test: platelets, value: 80, unit: 10^3/uL}]}
  - id: p06-clozapine
    flags: [lab-clozapine-anc, life-clozapine-smoking]
    patient: {patient_id: p06, age: 35, sex: male,
              prescriptions: [{name: Clozaril, dose: 300 mg}],
              labs: [{test: ANC, value: 0.8, unit: 10^3/uL}], lifestyle: {smoking: current}}
  - id: p07-atorvastatin
    flags: [life-atorvastatin-grapefruit, lab-atorvastatin-liver]
    patient: {patient_id: p07, age: 55, sex: female,
              prescriptions: [{name: Lipitor, dose: 40 mg}],
              labs: [{test: ALT, value: 150, unit: U/L}],
              lifestyle: {diet: {type: veg, meals: [grapefruit juice every morning]}}}
  - id: p08-clopidogrel-ssri
    flags: [ddi-clopidogrel-ssri, gene-amitriptyline-cyp2d6-pm]
    patient: {patient_id: p08, age: 66, sex: female,
              prescriptions: [{name: clopidogrel, dose: 75 mg}, {name: Zoloft, dose: 50 mg}, {name: amitriptyline, dose: 25 mg}],
              genotypes: [{gene: CYP2D6, diplotype: "*4/*4"}]}
  - id: p09-tramadol-theophylline
    flags: [gene-tramadol-cyp2d6-um, life-theophylline-smoking, lab-allopurinol-renal]
    patient: {patient_id: p09, age: 71, sex: male,
              prescriptions: [{name: tramadol, dose: 50 mg}, {name: theophylline, dose: 300 mg}, {name: allopurinol, dose: 100 mg}],
              labs: [{test: creatinine, value: 1.6, unit: mg/dL}], genotypes: [{gene: CYP2D6, diplotype: "*1/*2x2"}],
              lifestyle: {smoking: current}}
  - id: p10-cyp2c9-cyp2c19
    flags: [gene-phenytoin-cyp2c9-pm, gene-celecoxib-cyp2c9-pm, gene-citalopram-cyp2c19-pm]
    patient: {patient_id: p10, age: 50, sex: female,
              prescriptions: [{name: Dilantin, dose: 100 mg}, {name: Celebrex, dose: 200 mg}, {name: citalopram, dose: 20 mg}],
              genotypes: [{gene: CYP2C9, diplotype: "*3/*3"}, {gene: CYP2C19, diplotype: "*2/*2"}]}
